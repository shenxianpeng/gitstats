name: Generate and Deploy Report

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  deploy-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # get all history.

    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.10"

    - name: Install uv
      run: 'pip install --only-binary :all: uv'

    - name: Generate GitStats Report
      env:
        FONTCONFIG_FILE: /dev/null
      run: |
        uv sync --frozen --no-build --no-install-project --extra dev
        uv pip install --editable .
        uv run nox -s build

    - name: Save GitStats Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-report
        path: test-report

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: test-report
        keep_files: true # do not remove example reports
