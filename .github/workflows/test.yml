name: Test

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'gitstats/*'
      - 'tests/*'
      - '.github/workflows/test.yml'
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0  # full history for gitstats integration

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Configure git
      run: |
        git config --global user.name "CI Test"
        git config --global user.email "ci@test.com"
        git config --global init.defaultBranch main

    - name: Install uv
      run: 'pip install --only-binary :all: uv'

    - name: Install dependencies
      run: |
        uv sync --frozen --no-build --no-install-project --extra test
        uv pip install --editable .

    - name: Run pytest
      run: uv run python -m pytest tests/ -v --tb=short

    - name: Generate GitStats Report (smoke test)
      if: ${{ matrix.python-version == '3.10' }}
      env:
        FONTCONFIG_FILE: /dev/null
      run: |
        uv run gitstats . test-report -f json

    - name: Upload report artifact
      if: ${{ matrix.python-version == '3.10' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-report-${{ matrix.os }}
        path: test-report

  test-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: 3.12
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install uv
      run: 'pip install --only-binary :all: uv'

    - name: Build Docs
      run: |
        uv sync --frozen --no-build --no-install-project --extra dev
        uv pip install --editable .
        uv run nox -s docs
