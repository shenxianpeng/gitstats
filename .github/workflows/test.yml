name: Test

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      # the jobs below install from the lock file, so a change to it is a
      # change to what they test: Dependabot's weekly uv group touches
      # nothing else, and without this those updates merge untested
      - 'uv.lock'
      - 'gitstats/*'
      - 'tests/*'
      - '.github/workflows/test.yml'
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # full history for gitstats integration
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Configure git
      run: |
        git config --global user.name "CI Test"
        git config --global user.email "ci@test.com"
        git config --global init.defaultBranch main

    - name: Install uv
      run: 'pip install --only-binary :all: uv'

    - name: Install dependencies
      run: |
        uv sync --frozen --no-build --no-install-project --extra test
        uv pip install --editable .

    - name: Run pytest
      # Coverage must stay at 100% (pyproject.toml), except on 3.15: PyYAML
      # has no wheel for it yet, so the gallery scripts' tests are skipped there
      run: >-
        uv run python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing
        ${{ matrix.python-version == '3.15' && '--cov-fail-under=0' || '' }}

    - name: Generate GitStats Report (smoke test)
      if: ${{ matrix.python-version == '3.10' }}
      env:
        FONTCONFIG_FILE: /dev/null
      run: |
        uv run gitstats . test-report -f json

    - name: Upload report artifact
      if: ${{ matrix.python-version == '3.10' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-report-${{ matrix.os }}
        path: test-report

  ai-sdk-contract:
    # The ai extra is optional, so no other job installs it: the providers are
    # otherwise only ever exercised against the stand-in modules of
    # tests/test_ai_providers.py, and a renamed SDK surface reaches users
    # instead of CI, as it did in #357. Dependabot moves these pins in
    # uv.lock every week.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install uv
      run: 'pip install --only-binary :all: uv'

    - name: Install dependencies, with the ai extra
      run: |
        uv sync --frozen --no-build --no-install-project --extra ai --extra test
        uv pip install --editable .

    - name: Check the SDK surface the providers use
      # No --cov: these two files are a subset, which could not reach the
      # 100% the gate in pyproject.toml asks of the whole suite.
      run: >-
        uv run python -m pytest
        tests/test_ai_sdk_contract.py tests/test_ai_providers.py -v --tb=short

  test-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install uv
      run: 'pip install --only-binary :all: uv'

    - name: Build Docs
      run: |
        uv sync --frozen --no-build --no-install-project --extra dev
        uv pip install --editable .
        uv run nox -s docs
