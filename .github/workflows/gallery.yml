name: Gallery — Weekly Reports

on:
  schedule:
    # Monday 03:00 UTC+3 = Monday 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        repo:
          - { id: cpython,      name: "CPython",      url: "python/cpython"            }
          - { id: vscode,       name: "VS Code",      url: "microsoft/vscode"          }
          - { id: git,          name: "Git",          url: "git/git"                   }
          - { id: nginx,        name: "nginx",        url: "nginx/nginx"               }
          - { id: kubernetes,   name: "Kubernetes",   url: "kubernetes/kubernetes"     }
          - { id: nodejs,       name: "Node.js",      url: "nodejs/node"               }
          - { id: django,       name: "Django",       url: "django/django"             }
          - { id: rust,         name: "Rust",         url: "rust-lang/rust"            }
          - { id: react,        name: "React",        url: "facebook/react"            }
          - { id: homebrew,     name: "Homebrew",     url: "Homebrew/brew"             }
          # AI coding assistants: how much their own history names one
          - { id: codex,        name: "Codex CLI",    url: "openai/codex"              }
          - { id: gemini-cli,   name: "Gemini CLI",   url: "google-gemini/gemini-cli"  }
          - { id: opencode,     name: "OpenCode",     url: "anomalyco/opencode"        }
          - { id: aider,        name: "Aider",        url: "Aider-AI/aider"            }
          # Python and AI libraries
          - { id: pytorch,      name: "PyTorch",      url: "pytorch/pytorch"           }
          - { id: transformers, name: "Transformers", url: "huggingface/transformers"  }
          - { id: langchain,    name: "LangChain",    url: "langchain-ai/langchain"    }
          - { id: fastapi,      name: "FastAPI",      url: "fastapi/fastapi"           }
          - { id: pandas,       name: "pandas",       url: "pandas-dev/pandas"         }
          - { id: numpy,        name: "NumPy",        url: "numpy/numpy"               }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm needs tags to derive the version shown in reports
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install GitStats
        run: pipx install --python "$(which python)" .

      - name: Generate Report
        env:
          FONTCONFIG_FILE: /dev/null
        run: |
          git clone "https://github.com/${{ matrix.repo.url }}.git" /tmp/repo
          gitstats -c 'project_name=${{ matrix.repo.name }}' -c share_card=true \
            --site-url "https://shenxianpeng.dev/gitstats/gallery/${{ matrix.repo.id }}/" \
            /tmp/repo "report"

      # what a link to the report shows where it is shared: the pages point to it
      - name: Render Share Card
        run: >-
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars
          --window-size=1200,630 --screenshot="$PWD/report/share-card.png"
          "file://$PWD/report/share-card.html"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.repo.id }}
          path: report/

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm needs tags to derive the version the pages and the
          # AI data say they were made with
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: gallery

      - name: Assemble Gallery
        run: |
          # Each artifact is in gallery/report-<id>/, rename to gallery/<id>/
          # Display names come from each report's summary.json (project_name).
          for d in gallery/report-*; do
            id="${d#gallery/report-}"
            mv "$d" "gallery/$id"
          done

      - name: Fetch AI Snapshots
        # Each quarter's snapshot of ai.json is written once, by the first build
        # after the quarter ends; later builds find it on the site's branch and
        # leave it as it is.
        run: |
          git fetch --depth 1 origin gh-pages
          if git cat-file -e FETCH_HEAD:gallery/ai 2>/dev/null; then
            git archive FETCH_HEAD gallery/ai | tar -x
          fi
          ls gallery/ai 2>/dev/null || echo "No snapshots yet"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      # Installed, gitstats knows its version; run from the checkout, it says "dev"
      - name: Install GitStats
        run: pip install .

      - name: Generate Gallery Portfolio Page
        run: >-
          python scripts/generate_gallery_portfolio.py gallery
          --site-url https://shenxianpeng.dev/gitstats/gallery/ --share-card

      - name: Render Share Cards
        run: |
          for card in share-card ai-share-card; do
            if [ -f "gallery/$card.html" ]; then
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --window-size=1200,630 --screenshot="$PWD/gallery/$card.png" \
                "file://$PWD/gallery/$card.html"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gallery
          destination_dir: gallery
          keep_files: true
