name: Gallery — Weekly Reports

on:
  schedule:
    # Monday 03:00 UTC+3 = Monday 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        repo:
          - { id: cpython,    name: "CPython",      url: "python/cpython"        }
          - { id: vscode,     name: "VS Code",      url: "microsoft/vscode"      }
          - { id: git,        name: "Git",          url: "git/git"               }
          - { id: nginx,      name: "nginx",        url: "nginx/nginx"           }
          - { id: kubernetes, name: "Kubernetes",   url: "kubernetes/kubernetes" }
          - { id: nodejs,     name: "Node.js",      url: "nodejs/node"           }
          - { id: django,     name: "Django",       url: "django/django"         }
          - { id: rust,       name: "Rust",         url: "rust-lang/rust"        }
          - { id: react,      name: "React",        url: "facebook/react"        }
          - { id: homebrew,   name: "Homebrew",     url: "Homebrew/brew"         }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm needs tags to derive the version shown in reports
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install GitStats
        run: pipx install --python "$(which python)" .

      - name: Generate Report
        env:
          FONTCONFIG_FILE: /dev/null
        run: |
          git clone "https://github.com/${{ matrix.repo.url }}.git" /tmp/repo
          gitstats -c 'project_name=${{ matrix.repo.name }}' /tmp/repo "report"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.repo.id }}
          path: report/

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: gallery

      - name: Assemble Gallery
        run: |
          # Each artifact is in gallery/report-<id>/, rename to gallery/<id>/
          # Display names come from each report's summary.json (project_name).
          for d in gallery/report-*; do
            id="${d#gallery/report-}"
            mv "$d" "gallery/$id"
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Generate Gallery Portfolio Page
        # The script only needs the gitstats modules from this checkout
        # (stdlib-only imports), so no package installation is required.
        run: PYTHONPATH="$PWD" python scripts/generate_gallery_portfolio.py gallery

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gallery
          destination_dir: gallery
          keep_files: true
