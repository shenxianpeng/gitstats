<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>CNCF graduated: AI-assisted commits</title><style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;background:#ffffff;color:#211e1e;
font:24px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","DejaVu Sans",sans-serif}
main{height:630px;padding:54px 64px 44px;display:flex;flex-direction:column}
.brand{font:600 22px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;color:#716b6b;letter-spacing:.04em}
h1{font:700 72px/1.1 ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;margin:14px 0 8px;white-space:nowrap;overflow:hidden;

.sub{margin:0 0 30px;color:#716b6b}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border:2px solid #cfcecd}
.tiles div{padding:16px 22px;border-left:2px solid #cfcecd}
.tiles div:first-child{border-left:0}
.tiles dt{font:15px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;letter-spacing:.08em;text-transform:uppercase;color:#716b6b}
.tiles dd{margin:6px 0 0;font:700 40px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;white-space:nowrap}
.note{margin:20px 0 0}
.names{margin:8px 0 0;font:600 30px/1.5 ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;display:-webkit-box;-webkit-line-clamp:5;
-webkit-box-orient:vertical;overflow:hidden}
.history{margin:26px 0 0}
.history .columns{display:flex;align-items:flex-end;gap:2px;height:88px}
.history i{flex:1;background:#4a7ab5;border-radius:2px 2px 0 0;min-height:1px}
.history .axis{display:flex;justify-content:space-between;margin-top:6px;color:#716b6b;

.bars{display:grid;gap:12px;margin:4px 0 0}
.bars div{display:grid;grid-template-columns:240px 1fr 120px;align-items:center;gap:18px}
.bars b{font:600 26px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars i{display:block;height:26px;background:#4a7ab5;border-radius:0 4px 4px 0}
.bars span{font:700 28px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;text-align:right}
footer{margin-top:auto;display:flex;justify-content:space-between;color:#716b6b;
