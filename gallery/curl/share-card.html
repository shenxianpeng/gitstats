<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>curl: GitStats</title><style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;background:#ffffff;color:#211e1e;
font:24px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","DejaVu Sans",sans-serif}
main{height:630px;padding:54px 64px 44px;display:flex;flex-direction:column}
.brand{font:600 22px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;color:#716b6b;letter-spacing:.04em}
h1{font:700 72px/1.1 ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;margin:14px 0 8px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.sub{margin:0 0 30px;color:#716b6b}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border:2px solid #cfcecd}
.tiles div{padding:16px 22px;border-left:2px solid #cfcecd}
.tiles div:first-child{border-left:0}
.tiles dt{font:15px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;letter-spacing:.08em;text-transform:uppercase;color:#716b6b}
.tiles dd{margin:6px 0 0;font:700 40px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;white-space:nowrap}
.note{margin:20px 0 0}
.names{margin:8px 0 0;font:600 30px/1.5 ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;display:-webkit-box;-webkit-line-clamp:5;
-webkit-box-orient:vertical;overflow:hidden}
.history{margin:26px 0 0}
.history .columns{display:flex;align-items:flex-end;gap:2px;height:88px}
.history i{flex:1;background:#4a7ab5;border-radius:2px 2px 0 0;min-height:1px}
.history .axis{display:flex;justify-content:space-between;margin-top:6px;color:#716b6b;
font:16px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace}
.bars{display:grid;gap:12px;margin:4px 0 0}
.bars div{display:grid;grid-template-columns:240px 1fr 120px;align-items:center;gap:18px}
.bars b{font:600 26px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars i{display:block;height:26px;background:#4a7ab5;border-radius:0 4px 4px 0}
.bars span{font:700 28px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;text-align:right}
.sub.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bars.ranks{gap:10px}
.bars.ranks div{grid-template-columns:300px 1fr 160px}
.bars.ranks b{font-size:23px;font-weight:500;color:#716b6b}
.bars.ranks i{height:20px}
.bars.ranks span{font-size:24px;white-space:nowrap}
.facts{display:grid;gap:34px;margin:14px 0 0}
.facts div{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:28px}
.facts b{font:700 60px/1 ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;color:#4a7ab5;white-space:nowrap}
.facts span{font-size:27px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:3;
-webkit-box-orient:vertical;overflow:hidden}
.facts.n3{gap:24px;margin-top:8px}
.facts.n3 b{font-size:50px}
.facts.n3 span{font-size:23px;-webkit-line-clamp:2}
footer{margin-top:auto;display:flex;justify-content:space-between;color:#716b6b;
font:20px ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace}
</style></head><body><main><div class="brand">// GitStats report</div><h1>curl</h1><p class="sub">1999-12-29 &rarr; 2026-10-26</p><dl class="tiles"><div><dt>Commits</dt><dd>40,272</dd></div><div><dt>Authors</dt><dd>1,544</dd></div><div><dt>Lines of code</dt><dd>634,150</dd></div><div><dt>Files</dt><dd>4,610</dd></div></dl><div class="history"><div class="columns"><i style="height:0.0%"></i><i style="height:20.4%"></i><i style="height:38.7%"></i><i style="height:26.9%"></i><i style="height:35.0%"></i><i style="height:60.5%"></i><i style="height:31.5%"></i><i style="height:25.4%"></i><i style="height:41.2%"></i><i style="height:46.9%"></i><i style="height:32.7%"></i><i style="height:31.2%"></i><i style="height:31.5%"></i><i style="height:29.1%"></i><i style="height:43.6%"></i><i style="height:50.6%"></i><i style="height:34.8%"></i><i style="height:35.5%"></i><i style="height:39.5%"></i><i style="height:31.3%"></i><i style="height:36.3%"></i><i style="height:42.7%"></i><i style="height:41.4%"></i><i style="height:45.3%"></i><i style="height:54.8%"></i><i style="height:70.1%"></i><i style="height:100.0%"></i><i style="height:81.2%"></i></div><div class="axis"><span>1999</span><span>commits per year</span><span>2026</span></div></div><p class="note"><strong>0.1%</strong> of the commits of the last 12 months name an AI coding assistant.</p><footer><span>made with gitstats</span><span>github.com/shenxianpeng/gitstats</span></footer></main></body></html>
