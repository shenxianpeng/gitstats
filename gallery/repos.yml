# The repositories of the GitStats Gallery, by ecosystem:
# https://shenxianpeng.dev/gitstats/gallery/
#
# .github/workflows/gallery.yml makes one report for each, every Monday, and
# scripts/generate_gallery_portfolio.py lists them by these groups.
#
# Each group has an id (its page: /gallery/ecosystems/<id>.html, so do not
# rename one), a name, and the title its page's heading names its projects by.
#
#   id       the report's folder: https://shenxianpeng.dev/gitstats/gallery/<id>/
#            Lower case, digits and dashes. Do not rename one: links point to it.
#   name     how the pages name the repository
#   url      owner/name on GitHub
#   timeout  minutes the job may take (optional, default 90): the largest
#            histories take about five
#
# To suggest a repository, open an issue with the "Add my project to the
# Gallery" template.

